services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: note_app_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_DSN: "mysql:host=db;port=3306;dbname=note_app;charset=utf8mb4"
      DB_USER: "root"
      DB_PASS: "rootpassword"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: note_app_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: "note_app"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 15

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: note_app_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
